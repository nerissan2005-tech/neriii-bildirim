<body>
<div id="splash" class="splash" aria-label="Yükleniyor"><img src="icons/icon.svg" alt="" width="96" height="96"><p>Neriii</p></div>
<div id="login" class="login" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="dialog" class="dialog" hidden></div>
<div class="app" id="appRoot" hidden>
  <aside class="side">
    <p class="logo"><span class="full" id="logoName">Neriii ♡</span><span class="short" id="logoShort" aria-hidden="true">N♡</span></p>
    <nav id="nav" aria-label="Bölümler"></nav>
    <div class="side-foot">
      <p>Daha iyi bir sen,<br>her gün mümkün ♡</p>
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 60 C 24 44 34 30 52 6 M24 44 c -10 -2 -14 -10 -12 -18 c 8 2 12 8 12 18 M31 34 c 8 -6 16 -6 20 0 c -6 6 -14 6 -20 0 M39 23 c -8 -4 -10 -12 -6 -18 c 6 4 8 10 6 18 M18 52 c 8 -6 14 -4 18 1 c -6 4 -12 4 -18 -1"/></svg>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="greet">
        <span class="gsun" id="gsun"></span>
        <div>
          <h1 id="greetTitle"></h1>
          <p id="greetSub"></p>
        </div>
      </div>
      <div class="clock"><span id="clockDate"></span><strong id="clockTime"></strong></div>
      <div class="search">
        <span id="searchIco"></span>
        <input type="search" id="search" placeholder="Aradığın her şey burada…" aria-label="Ara" autocomplete="off">
        <ul class="results" id="results" hidden></ul>
      </div>
      <div class="actions">
        <button class="icon-btn bell" id="bellBtn" type="button" aria-label="Bildirimler"></button>
        <button class="install-btn" id="installBtn" type="button" data-install hidden aria-label="Uygulamayı indir"></button>
        <button class="avatar" id="avatarBtn" type="button" aria-label="Ayarlar"></button>
      </div>
    </header>
    <div id="view"></div>
  </div>
</div>
<nav id="tabbar" class="tabbar" aria-label="Alt menü" hidden></nav>
<div id="sheet" class="sheet" hidden></div>
<footer class="band" id="band" hidden>

</footer>
